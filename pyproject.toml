[project]
name = "netcore-tui"
version = "0.1.0"
description = "NetCore TUI — Data Center Network Management & Traffic Simulator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["textual>=0.80"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "ty"]

[project.scripts]
netcore = "netcore.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netcore"]

[tool.hatch.build.targets.wheel.force-include]
"src/netcore/infrastructure/persistence/migrations" = "netcore/infrastructure/persistence/migrations"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "PL", "PT"]
ignore = ["ANN401", "PLR0917", "PLR0913", "PLR0911", "PLR0912", "PLR0915", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR2004", "PLC0415", "PT018", "PT012", "PT021"]
"src/netcore/__main__.py" = ["PLC0415"]  # lazy imports keep --version fast

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"

[tool.ty.environment]
python-version = "3.12"
